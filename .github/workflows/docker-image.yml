name: Docker Image CI

on:
  push:
    branches: [ "docker-to-ec2" ]
  pull_request:
    branches: [ "docker-to-ec2" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v3

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔨 Build Project
        run: mvn clean install -DskipTests

      - name: 🔐 Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build Docker Image
        run: docker build -t taaanmoy/springboot-example:latest .

      - name: 📤 Push Docker Image to Docker Hub
        run: docker push taaanmoy/springboot-example:latest

  deploy:
    needs: build
    runs-on: [aws-ec2]  # your self-hosted EC2 runner label

    steps:
      - name: 🔐 Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: 📥 Pull image from Docker Hub
        run: docker pull taaanmoy/springboot-example:latest

      - name: 🧹 Delete old container if it exists
        run: |
          if [ "$(docker ps -aq -f name=springboot-example-container)" ]; then
            docker stop springboot-example-container
            docker rm springboot-example-container
          else
            echo "No existing container"
          fi

      - name: 🚀 Run Docker container
        run: docker run -d --name springboot-example-container -p 8080:8080 taaanmoy/springboot-example:latest
